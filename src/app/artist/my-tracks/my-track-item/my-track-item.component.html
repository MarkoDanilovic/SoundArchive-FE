<div class="card shadow-sm h-100" style="min-width: 700px; max-width: 900px; margin: auto;">
  <div class="card-body d-flex flex-row align-items-start">
    <!-- Image -->
    <div style="margin-right: 4rem;">
      <a [routerLink]="'/shop/' + track.id">
        <img
          [src]="getTrackImageUrl(imageBaseUrl, track.picture, track.id)"
          [alt]="track.name"
          class="img-fluid"
          style="max-width: 120px;"
        >
      </a>
    </div>

    <!-- Info -->
    <div class="flex-grow-1">
      <a [routerLink]="'/shop/' + track.id">
        <h6 class="text-uppercase mb-1">{{ track.name }}</h6>
      </a>
      <div><strong>Artist:</strong> {{ track.artist.artistName }}</div>
      <div><strong>Genre:</strong> {{ track.genre.name }}</div>
      <div><strong>Duration:</strong> {{ formatTime(track.duration) }}</div>
    </div>

    <!-- Buttons -->
    <div class="d-flex flex-column ms-4" style="min-width: 150px;">
      <button
        [routerLink]="'/shop/' + track.id"
        class="btn btn-outline-secondary btn-sm mb-2 w-100"
      >
        View in shop
      </button>
      <button
        class="btn btn-outline-warning btn-sm mb-2 w-100"
        (click)="openUpdateTrackDialog()"
      >
        Edit track info
      </button>
      <button
        class="btn btn-outline-danger btn-sm w-100"
        (click)="confirmDelete()"
      >
        Delete track
      </button>
    </div>
  </div>
</div>

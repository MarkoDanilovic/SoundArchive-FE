<div class="container my-4 d-flex flex-column align-items-center">

  <h1 class="mb-4 text-center w-100" style="max-width: 720px;">My tracks</h1>

  <app-paging-header
    [totalCount]="totalCount"
    [pageSize]="shopParams.pageSize"
    [pageNumber]="shopParams.pageNumber"
  ></app-paging-header>

  <div class="row g-4">
    <div class="col-12" *ngFor="let track of tracks">
      <app-my-track-item
        [track]="track"
        [genres]="genres"
        [mediums]="mediums"
        (itemRemoved)="onItemRemoved()"
      ></app-my-track-item>
    </div>

    <!-- Wrap button in container with same width & centering as cards -->
    <div class="col-12 d-flex justify-content-center">
      <div style="min-width: 700px; max-width: 900px; width: 100%;">
        <button
          type="button"
          class="btn btn-outline-warning btn-lg w-100"
          style="min-height: 80px;"
          (click)="openCreateTrackDialog()"
        >
          Add a new track
        </button>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-center mt-4">
    <app-pager
      [pageSize]="shopParams.pageSize"
      [totalCount]="totalCount"
      (pageChanged)="onPageChanged($event)"
    ></app-pager>
  </div>
</div>

<h2 mat-dialog-title>Create Track</h2>

<form [formGroup]="trackForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="mb-3">
      <mat-label>Track Image</mat-label>
      <input type="file" (change)="onFileChange($event)" accept="image/*" />
    </div>

    <div *ngIf="imagePreview" class="image-preview mb-3">
      <img [src]="imagePreview" alt="Image preview" class="img-thumbnail" />
    </div>

    <!-- Name -->
    <mat-form-field appearance="fill">
      <mat-label>Track Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="trackForm.get('name')?.hasError('required')">Track name is required.</mat-error>
    </mat-form-field>

    <!-- Duration -->
    <mat-form-field appearance="fill">
      <mat-label>Duration (seconds)</mat-label>
      <input matInput type="number" formControlName="duration" />
      <mat-error *ngIf="trackForm.get('duration')?.hasError('required')">Duration is required.</mat-error>
    </mat-form-field>

    <!-- Publish Date -->
    <mat-form-field appearance="fill">
      <mat-label>Publish Date</mat-label>
      <input matInput type="date" formControlName="publishDate" />
    </mat-form-field>

    <!-- Genre -->
    <mat-form-field appearance="fill">
      <mat-label>Genre</mat-label>
      <mat-select formControlName="genre">
        <mat-option *ngFor="let genre of data.genres" [value]="genre.id">{{ genre.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Records -->
    <div formArrayName="records">
      <div *ngFor="let record of records.controls; let i = index" [formGroupName]="i" class="record-entry">
        <h4>{{ getMediumName(record.get('medium')?.value) }}</h4>

        <mat-form-field appearance="fill">
          <mat-label>Quantity</mat-label>
          <input matInput type="number" formControlName="quantity" />
          <mat-error *ngIf="record.get('quantity')?.invalid">Required & must be > 0</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Price</mat-label>
          <input matInput type="number" formControlName="price" />
          <mat-error *ngIf="record.get('price')?.invalid">Required & must be >= 0</mat-error>
        </mat-form-field>

        <button mat-icon-button color="warn" type="button" (click)="removeRecord(i)" aria-label="Remove record">
          <mat-icon>remove_circle</mat-icon>
        </button>
      </div>
    </div>

    <!-- Add Missing Records -->
    <div>
      <h4>Add missing records:</h4>
      <ng-container *ngFor="let medium of data.mediums">
        <ng-container *ngIf="!isMediumAdded(medium.id)">
          <button mat-stroked-button color="accent" type="button" (click)="addRecord(medium)">
            + Add Record for {{ medium.name }}
          </button>
        </ng-container>
      </ng-container>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="mt-3">
    <div *ngIf="errorMessage" class="alert alert-danger text-center mt-3">{{ errorMessage }}</div>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="!trackForm.valid || isSubmitting">Create Track</button>
  </mat-dialog-actions>
</form>

<div class="d-flex flex-column flex-md-row align-items-center justify-content-between p-3 px-md-4 mb-3 bg-white border-bottom shadow-sm fixed-top">
  <img src="/assets/discogs.png" style="max-height: 70px;" alt="logo" class="logo" routerLink="/">
  <nav class="my-2 my-md-0 mr-md-3 text-uppercase" style="font-size: larger">
    <a class="p-2 " [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" >Home</a>
    <a class="p-2 " routerLink="/shop" routerLinkActive="active">Shop</a>
    <a class="p-2 " routerLink="/artist" routerLinkActive="active">Artists</a>
    <a class="p-2 " routerLink="/admin" *ngIf="logRole === 3">Admin</a>
  </nav>
  <div class="d-flex align-items-center">
    <a routerLink="/wishlist" class="position-relative mr-4" *ngIf="this.logRole !== 0">
      <i class="fa fa-star-o fa-2x text-dark"></i>
    </a>
    <a routerLink="/basket" class="position-relative">
      <i class="fa fa-shopping-cart fa-2x mr-5 text-dark"></i>
      <div class="cart-no">{{totalItems}}</div>
    </a>

    <div class="dropdown mr-3" *ngIf="logRole !== 0">
      <a class="dropdown-toggle text-dark" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        <i class="fa fa-user-circle fa-2x"></i>
      </a>
      <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
        <a class="dropdown-item" routerLink="/my-user" routerLinkActive="active">My User</a>
        <a class="dropdown-item" routerLink="/artist/my-artist" routerLinkActive="active" *ngIf="logArtist == true">My Artist</a>
        <a class="dropdown-item" routerLink="/artist/my-tracks" routerLinkActive="active" *ngIf="logArtist == true">My Tracks</a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item" (click)="logout()">Logout</a>
      </div>
    </div>

    <a class="btn btn-outline-secondary mr-2" (click)="openLoginDialog();" *ngIf="logRole === 0" >Login</a>
    <a class="btn btn-outline-secondary mr-3" *ngIf="logRole === 0" (click)="openRegisterDialog()" >Sign up</a>
  </div>

</div>

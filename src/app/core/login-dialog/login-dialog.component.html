<form class="form-signin" #loginForm="ngForm" (ngSubmit)="login(loginForm)">
  <div class="container-fluid">
    <h2 class="form-signin-heading">Login</h2>


    <br>
    <label for="username" >Username</label>
    <input type="text" id="username" name="username" ngModel class="form-control" placeholder="Username" #username="ngModel" required autofocus>
    <div *ngIf="!username.valid && username.touched"  class="alert alert-danger">Invalid username or password</div>
    <br>
    <label for="password" >Password</label>
    <input type="password" id="password" name="password" ngModel class="form-control" #password="ngModel" placeholder="Password" required>
    <div *ngIf="!password.valid && password.touched"  class="alert alert-danger">Invalid username or password</div>
    <hr>
    <div *ngIf="invalidLogin" class="alert alert-danger">
      {{ this.errorMessage }}
    </div>
    <button [disabled]="loginForm.invalid" class="btn btn-lg btn-primary btn-block" type="submit">Submit</button>
  </div>
</form>

<div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
  <div style="max-height: 80vh; overflow-y: auto; width: 100%; padding-top: 20px; padding-bottom: 20px;">
    <form class="form-signup" #registerForm="ngForm" (ngSubmit)="register(registerForm)">
      <div class="container-fluid">
        <h2 class="form-signup-heading">Register</h2>

        <div class="row">
          <!-- First Name -->
          <div class="col-md-6 mb-3">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" ngModel class="form-control" placeholder="Marko" required>
          </div>

          <!-- Last Name -->
          <div class="col-md-6 mb-3">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" ngModel class="form-control" placeholder="Danilovic" required>
          </div>

          <!-- Date of Birth -->
          <div class="col-md-6 mb-3">
            <label for="dateOfBirth">Date of birth</label>
            <input type="date" id="dateOfBirth" name="dateOfBirth" ngModel class="form-control" required>
          </div>

          <!-- Email -->
          <div class="col-md-6 mb-3">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" ngModel class="form-control" placeholder="email@gmail.com" required>
          </div>

          <!-- Description -->
          <div class="col-12 mb-3">
            <label for="description">Description</label>
            <textarea id="description" name="description" ngModel class="form-control" placeholder="Description..." required></textarea>
          </div>

          <!-- Social Media Link -->
          <div class="col-md-6 mb-3">
            <label for="socialMediaLink">Social media link</label>
            <input type="text" id="socialMediaLink" name="socialMediaLink" ngModel class="form-control" placeholder="#username" required>
          </div>

          <!-- Phone Number -->
          <div class="col-md-6 mb-3">
            <label for="phoneNumber">Phone number</label>
            <input type="text" id="phoneNumber" name="phoneNumber" ngModel class="form-control" placeholder="+381646500000" pattern="^\+?[0-9\s\-]{7,20}$" maxlength="20" required>
          </div>

          <!-- Address -->
          <div class="col-md-6 mb-3">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" ngModel class="form-control" placeholder="Street 10" required>
          </div>

          <!-- City -->
          <div class="col-md-6 mb-3">
            <label for="city">City</label>
            <input type="text" id="city" name="city" ngModel class="form-control" placeholder="Belgrade" required>
          </div>

          <!-- Country -->
          <div class="col-md-6 mb-3">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" ngModel class="form-control" placeholder="Serbia" required>
          </div>

          <!-- Credit Card Number -->
          <div class="col-md-6 mb-3">
            <label for="creditCardNumber">Credit card number</label>
            <input type="text" id="creditCardNumber" name="creditCardNumber" ngModel class="form-control" placeholder="12 0000156948 48" pattern="[0-9]{13,19}" required>
          </div>

          <!-- Username -->
          <div class="col-md-6 mb-3">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" ngModel class="form-control" placeholder="username" required>
          </div>

          <!-- Password -->
          <div class="col-md-6 mb-3">
            <label for="password1">Password</label>
            <input type="password" id="password1" name="password1" ngModel class="form-control" placeholder="qWfrs12vM!" required minlength="6">
          </div>

          <!-- Confirm Password -->
          <div class="col-md-6 mb-3">
            <label for="password2">Confirm Password</label>
            <input type="password" id="password2" name="password2" ngModel class="form-control" placeholder="qWfrs12vM!" required minlength="6">
          </div>
        </div>

        <hr>
        <div *ngIf="invalidRegister" class="alert alert-danger">
          Invalid entry!
        </div>
        <button class="btn btn-lg btn-primary btn-block" type="submit">Submit</button>
      </div>
    </form>
  </div>
</div>

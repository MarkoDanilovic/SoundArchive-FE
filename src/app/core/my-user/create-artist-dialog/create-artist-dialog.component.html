<h2 mat-dialog-title class="text-center mb-3">Create New Artist</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>

    <div>

      <div class="mb-3">
        <mat-label>Artist Image  </mat-label>
        <input type="file" (change)="onFileChange($event)" accept="image/*" />
      </div>

      <div *ngIf="imagePreview" class="image-preview mb-3">
        <img [src]="imagePreview" alt="Image preview" class="img-thumbnail" />
      </div>

      <div class="mb-3">
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Artist Name</mat-label>
          <input matInput formControlName="artistName" />
        </mat-form-field>
      </div>

      <div class="mb-3">
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" />
        </mat-form-field>
      </div>

      <div class="mb-3">
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>
      </div>

      <div class="mb-3">
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Birthday</mat-label>
          <input matInput type="date" formControlName="birthday" />
        </mat-form-field>
      </div>

      <div class="mb-3">
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Country</mat-label>
          <input matInput formControlName="country" />
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="mt-3">
    <div *ngIf="errorMessage" class="alert alert-danger text-center mt-3">{{ errorMessage }}</div>
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting">Create Artist</button>
  </mat-dialog-actions>
</form>

<div class="card shadow-sm h-100" style="max-width: 100%;">
  <div
    class="card-body d-flex flex-column flex-md-row align-items-start"
    style="min-width: 0;"
  >

    <!-- Image with margin to the right -->
    <div style="margin-right: 16px; flex-shrink: 0;">
      <a [routerLink]="'/shop/' + track.id">
        <img
          [src]="getTrackImageUrl(imageBaseUrl, track.picture, track.id)"
          [alt]="track.name"
          class="img-fluid"
          style="max-width: 120px;"
        />
      </a>
    </div>

    <!-- Info -->
    <div
      class="flex-grow-1 mb-3 mb-md-0 text-truncate"
      style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
    >
      <a
        [routerLink]="'/shop/' + track.id"
        class="d-inline-block text-truncate"
        style="max-width: 100%;"
      >
        <h6 class="text-uppercase mb-1 text-truncate">{{ track.name }}</h6>
      </a>
      <div><strong>Artist:</strong> {{ track.artist.artistName }}</div>
      <div><strong>Genre:</strong> {{ track.genre.name }}</div>
      <div><strong>Duration:</strong> {{ formatTime(track.duration) }}</div>
    </div>

    <!-- Buttons -->
    <div class="d-flex flex-column ms-md-3" style="min-width: 130px; max-width: 130px;">
      <button
        [routerLink]="'/shop/' + track.id"
        class="btn btn-outline-secondary btn-sm mb-2"
      >
        View
      </button>
      <button
        class="btn btn-outline-danger btn-sm"
        (click)="removeFromWishlist()"
      >
        Remove
      </button>
    </div>

  </div>
</div>

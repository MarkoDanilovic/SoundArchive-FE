<div class="form-inline mb-3">
  <input class="form-control mr-2"
         [(ngModel)]="searchParams.username"
         placeholder="Username"
         (keyup.enter)="onSearch()" />
  <button class="btn btn-primary mr-2" (click)="onSearch()">Search</button>
</div>

<table mat-table [dataSource]="users" class="mat-elevation-z1" style="width: 100%">

  <!-- Username -->
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef> Username </th>
    <td mat-cell *matCellDef="let user"> {{user.username}} </td>
  </ng-container>

  <!-- First Name -->
  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef> First Name </th>
    <td mat-cell *matCellDef="let user"> {{user.firstName}} </td>
  </ng-container>

  <!-- Last Name -->
  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef> Last Name </th>
    <td mat-cell *matCellDef="let user"> {{user.lastName}} </td>
  </ng-container>

  <!-- Email -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let user"> {{user.email}} </td>
  </ng-container>

  <!-- Phone -->
  <ng-container matColumnDef="phoneNumber">
    <th mat-header-cell *matHeaderCellDef> Phone Number </th>
    <td mat-cell *matCellDef="let user"> {{user.phoneNumber}} </td>
  </ng-container>

  <!-- Active -->
  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef> Active </th>
    <td mat-cell *matCellDef="let user"> {{user.active ? 'Yes' : 'No'}} </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let user">
      <button mat-icon-button color="warn" (click)="toggleBanUser(user)" [matTooltip]="user.active ? 'Ban' : 'Unban'">
        <mat-icon>{{ user.active ? 'lock_outline ' : 'lock_open' }}</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteUser(user.id)" matTooltip="Delete">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator
  [length]="totalCount"
  [pageSize]="searchParams.size"
  [pageIndex]="searchParams.page - 1"
  (page)="onPageChanged($event.pageIndex + 1)">
</mat-paginator>

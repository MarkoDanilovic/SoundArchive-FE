<div class="form-inline mb-3">
  <input
    class="form-control mr-2"
    style="width: 300px"
    placeholder="New medium name"
    [(ngModel)]="newMediumName"
    (keyup.enter)="addMedium()"
  />
  <button class="btn btn-primary" (click)="addMedium()">Add Medium</button>
</div>

<table mat-table [dataSource]="mediums" class="mat-elevation-z1" style="width: 100%">

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let medium">
      <ng-container *ngIf="editingId === medium.id; else viewMode">
        <input [(ngModel)]="editedName" class="form-control" style="width: 200px;" />
      </ng-container>
      <ng-template #viewMode>
        {{ medium.name }}
      </ng-template>
    </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let medium">
      <ng-container *ngIf="editingId === medium.id; else editButtons">
        <button mat-icon-button color="primary" (click)="saveEdit(medium)">
          <mat-icon>check</mat-icon>
        </button>
        <button mat-icon-button (click)="cancelEdit()">
          <mat-icon>close</mat-icon>
        </button>
      </ng-container>
      <ng-template #editButtons>
        <button mat-icon-button color="accent" (click)="startEdit(medium)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteMedium(medium.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </ng-template>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['name', 'actions']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['name', 'actions'];"></tr>
</table>

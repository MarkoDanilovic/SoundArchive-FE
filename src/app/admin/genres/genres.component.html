<div class="form-inline mb-3">
  <input
    class="form-control mr-2"
    style="width: 300px"
    placeholder="New genre name"
    [(ngModel)]="newGenreName"
    (keyup.enter)="addGenre()"
  />
  <button class="btn btn-primary" (click)="addGenre()">Add Genre</button>
</div>

<table mat-table [dataSource]="genres" class="mat-elevation-z1" style="width: 100%">

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let genre">
      <ng-container *ngIf="editingId === genre.id; else viewMode">
        <input [(ngModel)]="editedName" class="form-control" style="width: 200px;" />
      </ng-container>
      <ng-template #viewMode>
        {{ genre.name }}
      </ng-template>
    </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let genre">
      <ng-container *ngIf="editingId === genre.id; else editButtons">
        <button mat-icon-button color="primary" (click)="saveEdit(genre)">
          <mat-icon>check</mat-icon>
        </button>
        <button mat-icon-button (click)="cancelEdit()">
          <mat-icon>close</mat-icon>
        </button>
      </ng-container>
      <ng-template #editButtons>
        <button mat-icon-button color="accent" (click)="startEdit(genre)" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteGenre(genre.id)" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </ng-template>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['name', 'actions']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['name', 'actions'];"></tr>
</table>

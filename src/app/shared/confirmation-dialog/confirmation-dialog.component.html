<h2 mat-dialog-title>{{ data.heading }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">
    {{ data.cancelText || 'Cancel' }}
  </button>
  <button mat-button color="warn" (click)="onConfirm()">
    {{ data.confirmText || 'Delete' }}
  </button>
</mat-dialog-actions>

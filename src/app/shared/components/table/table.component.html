<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" class="mat-table" multiTemplateDataRows>

    <ng-container *ngFor="let column of displayedColumns; let i = index" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef> {{ displayedLabels[i] }} </th>
      <td mat-cell *matCellDef="let element"> {{ getNestedValue(element, column) }} </td>
    </ng-container>

    <ng-container *ngIf="actions.length" matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button *ngFor="let actionType of actions"
                mat-button color="primary"
                (click)="onAction(actionType, element)">
          {{ actionType }}
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns.concat(actions.length ? ['actions'] : [])"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns.concat(actions.length ? ['actions'] : [])"></tr>
  </table>

  <mat-paginator
    [length]="pagination?.totalCount || 0"
    [pageSize]="pagination?.pageSize || 10"
    [pageIndex]="(pagination?.currentPage || 1) - 1"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>

<h2 mat-dialog-title>Checkout</h2>
<form [formGroup]="submitForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>

    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Address</mat-label>
      <input matInput formControlName="address" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-100">
      <mat-label>City</mat-label>
      <input matInput formControlName="city" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Country</mat-label>
      <input matInput formControlName="country" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Postal Code</mat-label>
      <input matInput formControlName="postalCode" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Payment Method</mat-label>
      <mat-select formControlName="paymentMethod">
        <mat-option value="Cash on receive">Cash on receive</mat-option>
        <mat-option value="Card on receive">Card on receive</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Comment</mat-label>
      <textarea matInput formControlName="comment" rows="3"></textarea>
    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions align="end" class="mt-3">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitForm.invalid">Confirm</button>
  </mat-dialog-actions>
</form>
